<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        .welcome-card {
            text-align: center;
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease-in;
        }
        h1 {
            color: #764ba2;
            font-size: 48px;
            margin: 0;
            animation: slideIn 0.8s ease-out;
        }
        .subtitle {
            color: #667eea;
            font-size: 20px;
            margin-top: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>🎉 ¡Los saluda Yokic! 🎉</h1>
        <div class="subtitle">Bienvenido a tu navegador virtual</div>
    </div>
</body>
</html>
